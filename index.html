<!doctype html>

  <head>

    <meta

    <!-- Favicon (placeholder — replace public/favicon.svg with the final mark). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!--
      Open Graph / Twitter.
      NOTE: social scrapers require an ABSOLUTE og:image URL. Once the final
      domain is known, change the two og:image / twitter:image values to the
      full URL, e.g. https://<user>.github.io/the-tenth-colour/images/og-the-tenth-colour.jpg
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Tenth Colour" />
    <meta
      property="og:description"
      content="The final colour was not an ending. It was a door."
    />
    <meta property="og:image" content="%BASE_URL%images/og-the-tenth-colour.jpg" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Tenth Colour" />
    <meta
      name="twitter:description"
      content="The final colour was not an ending. It was a door."
    />
    <meta name="twitter:image" content="%BASE_URL%images/og-the-tenth-colour.jpg" />

    <!-- Canonical (placeholder — set to the final URL before launch). -->
    <link rel="canonical" href="https://example.com/the-tenth-colour/" />

    <!-- Fonts: preconnect, then a single non-blocking stylesheet request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500&display=swap"

          Moon Confessions · Volume 112
        </p>
        <h1 style="font-weight: 300;">The Tenth Colour</h1>
        <p><em>A final chapter from the Days of Wonder.</em></p>
        <p>
          This story is best experienced with JavaScript enabled, but its words
          do not depend on it. On the twentieth morning, Mr. D woke shrunk upon
          a coffee table, beside the ten colours of the assignment — and the
          tenth colour, Mint, was not an ending. It was a door.
